# This file lets you configure the price additions for enchantments on sold items
# These prices or percents are additional on top of the sell price of a shop item per enchantment

# The default price additions below aim for a 100 - 150 percent on top of the base sell price for max enchanted items

# For example:
# A diamond sword with max enchantments (sharpness, looting, knockback, unbreaking, fire aspect, sweeping edge and mending)
# has a additional price percent of about 150% on top of the base sell price of the shop item (Note that the shop item has NO enchantments)
# Example base sell price is $2500, then a max enchanted sword will sell for $6250

# Similar for a max enchanted chestplate which will have a additional price of about 90% (Note that the shop item has NO enchantments)
# Example base sell price is $950, then this max enchanted chestplate sells for $1805

# If a shop item has for example sharpness 3 already on it, then if the item sold has sharpness 5
# the level multiplier is only calculated 2 times instead of 5

enchants:
  aqua_affinity:
    percent: 5
  bane_of_arthropods:
    percent: 8.5
    level-multiplier: 0.5
  blast_protection:
