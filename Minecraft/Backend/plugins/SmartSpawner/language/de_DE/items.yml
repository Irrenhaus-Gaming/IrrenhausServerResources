# SmartSpawner items and holograms (German, our own translation of en_US)
# Full guide: https://docs.smartspawner.site/docs/language
# Colours: MiniMessage (<red>, <#5DB5F1>, <gradient:#5DB5F1:#FFFFFF>) or legacy (&c, &#5DB5F1).
# A mob or material section overrides default key by key. Keys it leaves out come from default.

# {entity} {entity_small} {exp} {loot_items}. One line of {loot_items}: {amount} {item_name} {chance}
smart_spawner:
  default:
    name: '<#5db5f1>{entity}-Spawner'
    loot_items: '  <#ecf0f1> • {amount} {item_name} <#3498db>({chance}%)'
    loot_items_empty: '  <#ecf0f1> •  Keine'
    lore:
      - ''
      - ' <#5db5f1> <smallcaps>Details</smallcaps>:'
      - '  <#ecf0f1> • <white>EP pro Mob: <green>{exp}'
      - ''
      - ' <#5db5f1> <smallcaps>Drops</smallcaps>:'
      - '{loot_items}'
      - ''
  PIG:
    name: '<#ff77b7>{entity}-Spawner'
    loot_items: '  <#fff0f7> • {amount} {item_name} <#ff8fc7>({chance}%)'
    loot_items_empty: '  <#fff0f7> •  Keine'
    lore:
      - ''
      - ' <#ff77b7> <smallcaps>Details</smallcaps>:'
      - '  <#fff0f7> • <white>EP pro Mob: <#ff8fc7>{exp}'
      - ''
      - ' <#ff77b7> <smallcaps>Drops</smallcaps>:'
      - '{loot_items}'
      - ''
  BLAZE:
    name: '<#ffb300>{entity}-Spawner'
    loot_items: '  <#fff4cc> • {amount} {item_name} <#ffc107>({chance}%)'
    loot_items_empty: '  <#fff4cc> •  Keine'
    lore:
      - ''
      - ' <#ffb300> <smallcaps>Details</smallcaps>:'
      - '  <#fff4cc> • <white>EP pro Mob: <#ffd54f>{exp}'
      - ''
      - ' <#ffb300> <smallcaps>Drops</smallcaps>:'
      - '{loot_items}'
      - ''

# {entity} {entity_small} {exp} {loot_items}. One line of {loot_items}: {amount} {item_name} {chance}
# Unused: spawner_items.yml defines no item spawners.
item_spawner:
  default:
    name: '<#5db5f1>{entity}-Spawner'
    loot_items: '  <#ecf0f1> • {amount} {item_name} <#3498db>({chance}%)'
    loot_items_empty: '  <#ecf0f1> •  Keine'
    lore:
      - ''
      - ' <#5db5f1> <smallcaps>Details</smallcaps>:'
      - '  <#ecf0f1> • <white>EP: <green>{exp}'
      - ''
      - ' <#5db5f1> <smallcaps>Drops</smallcaps>:'
      - '{loot_items}'
      - ''

# {entity} {entity_small}. Delete this section to keep the game's own name for vanilla spawners.
vanilla_spawner:
  default:
    name: '{entity}-Spawner'
    lore:

# Lines above each spawner when holograms are on.
# {entity} {entity_small} {stack_size} {current_exp} {max_exp} {used_slots} {max_slots} {percent_storage_decimal} {percent_storage_rounded} {percent_exp_decimal} {percent_exp_rounded}
hologram:
  lines:
    - '<dark_gray>[<white>{stack_size}<dark_gray>] <#5db5f1>{entity}-Spawner'
    - '<#5db5f1>• <white>EP: <green>{current_exp}<white>/<green>{max_exp}'
    - '<#5db5f1>• <white>Items: <yellow>{used_slots}<white>/<yellow>{max_slots}'
