# SmartSpawner number formats and mob names (German, our own translation of en_US)
# Full guide: https://docs.smartspawner.site/docs/language

# {s} is the shortened number.
format_number:
  thousand: '{s}K'       # Example: 5000 → 5K
  million: '{s} Mio.'    # Example: 2000000 → 2 Mio.
  billion: '{s} Mrd.'    # Example: 1500000000 → 1.5 Mrd.
  trillion: '{s} Bio.'   # Example: 1000000000000 → 1 Bio.
  default: '{s}'         # Fallback format when no other rule matches

