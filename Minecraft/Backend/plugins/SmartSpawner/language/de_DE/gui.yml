# SmartSpawner GUI text (German, our own translation of en_US; prices in Moneten)
# Full guide: https://docs.smartspawner.site/docs/language
# Colours: MiniMessage (<red>, <#5DB5F1>, <gradient:#5DB5F1:#FFFFFF>) or legacy (&c, &#5DB5F1).

main:
  # {amount} {entity} {entity_small}
  title: '{entity_small}-<smallcaps>Spawner</smallcaps>'
  title_stacked: '{amount}x {entity_small}-<smallcaps>Spawner</smallcaps>'

  # {current_items} {max_slots} {percent_storage_rounded} {total_sell_price} {loot_items} {entity} {entity_small}
  storage:
    name: '<#5db5f1><smallcaps>Lager</smallcaps> <white><smallcaps>öffnen</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ <smallcaps>Info</smallcaps>:'
      - '  <dark_gray>• <white>Hier siehst und verwaltest'
      - '   <white>du alle Items, die dieser'
      - '   <white>Spawner gesammelt hat.'
      - ''
      - ' <#5db5f1>★ <smallcaps>Füllstand</smallcaps>: <white>{percent_storage_rounded}%'
      - '{loot_items}'
      - ''
      - '<#5db5f1> ▸ Klicke, um das Lager zu öffnen!'
    # One line of {loot_items}: {item_name} {amount} {raw_amount} {chance}
    loot_items: '  <dark_gray>• <white>{item_name}<white>: <yellow>{amount}'
    loot_items_empty: '  <dark_gray>• <white>Keine Items gelagert'

  # {entity} {entity_small} {stack_size} {range} {delay} {min_mobs} {max_mobs} {current_items} {max_items} {percent_storage_rounded} {percent_storage_decimal} {current_exp} {max_exp} {raw_current_exp} {raw_max_exp} {percent_exp_rounded} {percent_exp_decimal} {time} {total_sell_price}
  info:
    name: ' <white><smallcaps>Spawner</smallcaps>-<#5db5f1><smallcaps>Info</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ <smallcaps>Werte</smallcaps>:'
      - '   <dark_gray>• <white>Stapel: <yellow>{stack_size}'
      - '   <dark_gray>• <white>Reichweite: <yellow>{range} <white>Blöcke'
      - '   <dark_gray>• <white>Mobs: <yellow>{min_mobs}<white>-<yellow>{max_mobs}'
      - '   <dark_gray>• <white>Intervall: <yellow>{delay} <white>Sekunden'
      - ''
      - ' <#5db5f1>★ <smallcaps>Nächster Spawn</smallcaps>: <white>{time}'
      - '   <dark_gray>• <white>EP: <yellow>{percent_exp_rounded}%'
      - '   <dark_gray>• <white>Lager: <yellow>{percent_storage_rounded}%'
      - '   <dark_gray>• <white>Verkaufswert: <green>{total_sell_price} Moneten'
      - ''
      - '<#5db5f1> ▸ Linksklick: <white>Verkaufen & EP einsammeln'
    # Used when the player cannot sell.
    lore_no_shop:
      - ''
      - ' <#5db5f1>ℹ <smallcaps>Werte</smallcaps>:'
      - '   <dark_gray>• <white>Stapel: <yellow>{stack_size}'
      - '   <dark_gray>• <white>Reichweite: <yellow>{range} <white>Blöcke'
      - '   <dark_gray>• <white>Mobs: <yellow>{min_mobs}<white>-<yellow>{max_mobs}'
      - '   <dark_gray>• <white>Intervall: <yellow>{delay} <white>Sekunden'
      - ''
      - ' <#5db5f1>★ <smallcaps>Nächster Spawn</smallcaps>: <white>{time}'
      - '   <dark_gray>• <white>EP: <yellow>{percent_exp_rounded}%'
      - '   <dark_gray>• <white>Lager: <yellow>{percent_storage_rounded}%'
      - ''
    # Shown as {time} when the spawner is not counting down.
    lore_full: '<#ff4444><smallcaps>Lager voll</smallcaps>'
    lore_inactive: '<#ff4444><smallcaps>Inaktiv</smallcaps>'
    lore_no_loot: '<#ff4444><smallcaps>Keine Drops eingestellt</smallcaps>'

  # {current_exp} {max_exp} {percent_exp_rounded} {percent_exp_decimal}
  exp:
    name: '<#5db5f1><smallcaps>EP</smallcaps> <white><smallcaps>einsammeln</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ <smallcaps>Info</smallcaps>:'
      - '  <dark_gray>• <white>Sammle die EP ein oder'
      - '   <white>repariere damit deine'
      - '   <white>Ausrüstung mit Reparatur.'
      - ''
      - ' <#5db5f1>★ <smallcaps>Füllstand</smallcaps>: <white>{percent_exp_rounded}%'
      - '  <dark_gray>• <white>Gespeicherte EP: <green>{current_exp}<white>/<green>{max_exp}'
      - ''
      - '<#5db5f1> ▸ Klicke, um die EP einzusammeln!'

storage:
  # {current_page} {total_pages} {amount} {entity} {entity_small}
  title: '[{current_page}/{total_pages}] <smallcaps>Spawner-Lager</smallcaps>'
  # Used instead of title for a spawner that is not stacked.
  title_single: '[{current_page}/{total_pages}] <smallcaps>Spawner-Lager</smallcaps>'

  # {target_page}
  previous_page:
    name: '<#37eb9a><smallcaps>Vorherige Seite</smallcaps>'
    lore:
      - '<#2cc483> ▸ <#f8f8ff>Klicke für Seite <#37eb9a>{target_page}'
  next_page:
    name: '<#37eb9a><smallcaps>Nächste Seite</smallcaps>'
    lore:
      - '<#2cc483> ▸ <#f8f8ff>Klicke für Seite <#37eb9a>{target_page}'

  # {total_sell_price}
  sell:
    name: '<green><smallcaps>Items</smallcaps> <white><smallcaps>verkaufen</smallcaps>'
    lore:
      - ''
      - ' <green>ℹ <smallcaps>Info</smallcaps>:'
      - '  <dark_gray>• <white>Verkauft alle Items'
      - '   <white>aus dem Lager.'
      - ''
      - '<green> ▸ Klicke zum Verkaufen!'
  sell_and_exp:
    name: '<white><smallcaps>Verkaufen und</smallcaps> <green><smallcaps>EP einsammeln</smallcaps>'
    lore:
      - ''
      - ' <green>ℹ <smallcaps>Info</smallcaps>:'
      - '  <dark_gray>• <white>Verkauft alle Items und'
      - '   <white>sammelt die gespeicherten EP ein.'
      - '  <dark_gray>• <white>Geschätzt: <green>{total_sell_price} Moneten'
      - ''
      - '<green> ▸ Klicke zum Fortfahren!'

  back:
    name: '<white><smallcaps>Zurück zum</smallcaps> <#ff6b6b><smallcaps>Hauptmenü</smallcaps>'
    lore:
      - ''
      - ' <#dadada>ℹ <smallcaps>Info</smallcaps>:'
      - '  <dark_gray>• <white>Klicke, um zum vorherigen'
      - '   <white>Menü zurückzukehren.'
      - ''
      - '<red> ▸ Klicke für zurück!'

  take_all:
    name: '<#5db5f1><smallcaps>Alles</smallcaps> <white><smallcaps>nehmen</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ <smallcaps>Info</smallcaps>:'
      - '  <dark_gray>• <white>Nimmt alle Items'
      - '   <white>von dieser Seite.'
      - ''
      - '<#5db5f1> ▸ Klicke zum Nehmen!'

  filter:
    name: '<#5db5f1><smallcaps>Drops</smallcaps> <white><smallcaps>filtern</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ <smallcaps>Info</smallcaps>:'
      - '  <dark_gray>• <white>Lege fest, welche Items'
      - '   <white>dieser Spawner behält.'
      - ''
      - '<#5db5f1> ▸ Klicke für die Filter!'

  # {available_items} is the list built from selected_item, unselected_item and no_item ({item_name}).
  sort:
    name: '<#5db5f1><smallcaps>Items</smallcaps> <white><smallcaps>sortieren</smallcaps>'
    lore:
      - ''
      - '{available_items}'
      - ''
      - '<#5db5f1> ▸ Klicke zum Sortieren!'
    selected_item: ' <#5db5f1>• {item_name}'
    unselected_item: ' <white>• {item_name}'
    no_item: ' <gray>• Keine'

  drop_page:
    name: '<#ff6b6b><smallcaps>Seite</smallcaps> <white><smallcaps>fallen lassen</smallcaps>'
    lore:
      - ''
      - ' <#ff6b6b>⚠ <smallcaps>Achtung</smallcaps>:'
      - '  <dark_gray>• <white>Alle Items dieser Seite'
      - '   <white>landen auf dem Boden.'
      - ''
      - '<#ff6b6b> ▸ Klicke zum Fallenlassen!'

  # {current_exp}
  collect_exp:
    name: '<#5db5f1><smallcaps>EP</smallcaps> <white><smallcaps>einsammeln</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ <smallcaps>Info</smallcaps>:'
      - '  <dark_gray>• <white>Verfügbare EP: <green>{current_exp}'
      - ''
      - '<#5db5f1> ▸ Klicke zum Einsammeln!'

  # Empty unless a layout places the info button in the storage. Same placeholders as main.storage.
  info:
    name: ''
    lore:

# {total_sell_price} {current_exp}
sell_confirm:
  title: '<smallcaps>Verkauf bestätigen</smallcaps>'

  cancel:
    name: '<#ff6b6b><smallcaps>Verkauf</smallcaps> <white><smallcaps>abbrechen</smallcaps>'
    lore:
      - ''
      - ' <#ff6b6b>⚠ <smallcaps>Info</smallcaps>:'
      - '  <dark_gray>• <white>Zurück, ohne etwas'
      - '   <white>zu verkaufen.'
      - ''
      - '<#ff6b6b> ▸ Klicke zum Abbrechen!'

  confirm:
    name: '<#5db5f1><smallcaps>Verkauf</smallcaps> <white><smallcaps>bestätigen</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ Du erhältst:'
      - '  <dark_gray>• <white>Geld: <green>{total_sell_price} Moneten'
      - ''
      - '<#5db5f1> ▸ Klicke, um den Verkauf zu bestätigen!'

  confirm_with_exp:
    name: '<white><smallcaps>Verkauf</smallcaps> <#5db5f1><smallcaps>und EP</smallcaps> <white><smallcaps>bestätigen</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ Du erhältst:'
      - '  <dark_gray>• <white>Geld: <green>{total_sell_price} Moneten'
      - '  <dark_gray>• <white>EP: <green>{current_exp}'
      - ''
      - '<#5db5f1> ▸ Klicke zum Bestätigen!'

  # {entity} {entity_small} {current_items} {max_items} {current_exp} {total_sell_price} {percent_storage_decimal} {percent_storage_rounded} {loot_items}
  summary:
    name: '<#5db5f1><smallcaps>Verkaufsübersicht</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ <smallcaps>Info</smallcaps>:'
      - '{loot_items}'
      - '  <dark_gray>• <green>+ <white>EP: <yellow>{current_exp}'
      - '  <dark_gray>• <green>+ <white>Geld: <green>{total_sell_price} Moneten'
    # One line of {loot_items}: {amount} {item_name} {chance}
    loot_items: '  <dark_gray>• <#ff6b6b>- <white>{item_name}<white>: <yellow>{amount}'
    loot_items_empty: '  <dark_gray>• <#ff6b6b>- <white>Nichts zu verkaufen'

filter:
  title: '    <smallcaps>Erlaubt             blockiert</smallcaps>'

  divider:
    name: '<#5db5f1><smallcaps>Drop-Filter</smallcaps>'
    lore:
      - ''
      - ' <#5db5f1>ℹ <smallcaps>Info</smallcaps>:'
      - '  <dark_gray>• <white>Links: erlaubte Items'
      - '  <dark_gray>• <white>Rechts: blockierte Items'
      - ''
      - '<#5db5f1> ▸ Klicke, um zum Lager zurückzukehren!'

  # {item_name}
  allowed:
    name: '<white>{item_name}<#37eb9a> erlaubt'
    lore:
      - '<#37eb9a> ▸ <white>Klicke, um dieses Item zu blockieren!'
  blocked:
    name: '<white>{item_name}<#ff6b6b> blockiert'
    lore:
      - '<#ff6b6b> ▸ <white>Klicke, um dieses Item zu erlauben!'

# The GUIs opened by commands: /ss list, /ss near, /ss prices and /ss editloot.
command:
  # {target_page} {previous_menu}
  navigation:
    previous_page:
      name: '<#37eb9a><smallcaps>Vorherige Seite</smallcaps>'
      lore:
        - '<#2cc483> ▸ <#f8f8ff>Klicke für Seite <#37eb9a>{target_page}'
    next_page:
      name: '<#37eb9a><smallcaps>Nächste Seite</smallcaps>'
      lore:
        - '<#2cc483> ▸ <#f8f8ff>Klicke für Seite <#37eb9a>{target_page}'
    close:
      name: '<#ff6b6b><smallcaps>Schließen</smallcaps>'
      lore:
        - '<#ff6b6b> ▸ <white>Klicke zum Schließen!'
    back:
      name: '<white><smallcaps>Zurück:</smallcaps> <#ff6b6b>{previous_menu}'
      lore:
        - '<red> ▸ <white>Klicke für zurück!'
    # What {previous_menu} shows.
    menu_names:
      server_selection: '<smallcaps>Serverauswahl</smallcaps>'
      world_selection: '<smallcaps>Weltauswahl</smallcaps>'
      spawner_list: '<smallcaps>Spawner-Liste</smallcaps>'
      spawner_management: '<smallcaps>Spawner-Verwaltung</smallcaps>'

  list:
    # {server}. Only shown on cross-server setups.
    servers:
      title: '<smallcaps>Server wählen</smallcaps>'
      current:
        name: '<#37eb9a>{server}'
        lore:
          - ''
          - ' <#37eb9a>ℹ <smallcaps>Status</smallcaps>:'
          - '  <dark_gray>• <white>Dieser Server'
          - ''
          - '<#37eb9a> ▸ Klicke für die Spawner!'
      remote:
        name: '<#f0c857>{server}'
        lore:
          - ''
          - ' <#f0c857>ℹ <smallcaps>Status</smallcaps>:'
          - '  <dark_gray>• <white>Anderer Server'
          - ''
          - '<#f0c857> ▸ Klicke für die Spawner!'

    # {world_name} {total} {total_stacked} {remote_world_lore} {server}
    worlds:
      title: '<smallcaps>Welt wählen</smallcaps>'
      title_server: '{server}: <smallcaps>Welten</smallcaps>'
      names:
        overworld: 'Oberwelt'
        nether: 'Nether'
        the_end: 'Das Ende'
        custom: 'Welt {world_name}'
      buttons:
        NORMAL:
          name: '<#37eb9a>{world_name}'
          lore:
            - ''
            - ' <#37eb9a>ℹ <smallcaps>Werte</smallcaps>:'
            - '  <dark_gray>• <white>Spawner-Blöcke: <yellow>{total}'
            - '  <dark_gray>• <white>Gestapelte Spawner: <yellow>{total_stacked}'
            - '{remote_world_lore}'
            - ''
            - '<#37eb9a> ▸ Klicke für die Liste!'
        NETHER:
          name: '<#ff6b6b>{world_name}'
          lore:
            - ''
            - ' <#ff6b6b>ℹ <smallcaps>Werte</smallcaps>:'
            - '  <dark_gray>• <white>Spawner-Blöcke: <yellow>{total}'
            - '  <dark_gray>• <white>Gestapelte Spawner: <yellow>{total_stacked}'
            - '{remote_world_lore}'
            - ''
            - '<#ff6b6b> ▸ Klicke für die Liste!'
        THE_END:
          name: '<#c8a2ff>{world_name}'
          lore:
            - ''
            - ' <#c8a2ff>ℹ <smallcaps>Werte</smallcaps>:'
            - '  <dark_gray>• <white>Spawner-Blöcke: <yellow>{total}'
            - '  <dark_gray>• <white>Gestapelte Spawner: <yellow>{total_stacked}'
            - '{remote_world_lore}'
            - ''
            - '<#c8a2ff> ▸ Klicke für die Liste!'
        CUSTOM:
          name: '<#5db5f1>{world_name}'
          lore:
            - ''
            - ' <#5db5f1>ℹ <smallcaps>Werte</smallcaps>:'
            - '  <dark_gray>• <white>Spawner-Blöcke: <yellow>{total}'
            - '  <dark_gray>• <white>Gestapelte Spawner: <yellow>{total_stacked}'
            - '{remote_world_lore}'
            - ''
            - '<#5db5f1> ▸ Klicke für die Liste!'
      remote_lore:
        - ''
        - ' <#f0c857>ℹ <smallcaps>Andere Welt</smallcaps>:'
        - '  <dark_gray>• <white>Server: <yellow>{server}'

    # {current} {total} {world} {server} {available_options} {option_name} {id} {entity} {size} {status} {last_player} {x} {y} {z}
    spawners:
      title: '[{current}/{total}] {world}'
      title_remote: '[{current}/{total}] {world} ({server})'
      filter:
        name: '<#5db5f1><smallcaps>Spawner</smallcaps> <white><smallcaps>filtern</smallcaps>'
        lore:
          - ''
          - '{available_options}'
          - ''
          - '<#5db5f1> ▸ Klicke, um den Filter zu ändern!'
      filter_options:
        all: 'Alle'
        active: 'Aktiv'
        inactive: 'Inaktiv'
      sort:
        name: '<#5db5f1><smallcaps>Spawner</smallcaps> <white><smallcaps>sortieren</smallcaps>'
        lore:
          - ''
          - '{available_options}'
          - ''
          - '<#5db5f1> ▸ Klicke, um die Sortierung zu ändern!'
      sort_options:
        default: 'Standard (ID)'
        stack_size_asc: 'Stapelgröße (↑)'
        stack_size_desc: 'Stapelgröße (↓)'
      selected_option: ' <#5db5f1>• {option_name}'
      unselected_option: ' <white>• {option_name}'
      spawner:
        name: '<white><smallcaps>Spawner</smallcaps> <#5db5f1>#{id}'
        lore:
          - ''
          - ' <#5db5f1>ℹ <smallcaps>Info</smallcaps>:'
          - '  <dark_gray>• <white>Mob: <yellow>{entity}'
          - '  <dark_gray>• <white>Stapel: <yellow>{size}'
          - '  <dark_gray>• <white>Status: {status}'
          - '  <dark_gray>• <white>Letzter Spieler: <yellow>{last_player}'
          - '  <dark_gray>• <white>Position: <gray>x: {x}, y: {y}, z: {z}'
          - ''
          - '<#5db5f1> ▸ Klicke, um diesen Spawner zu verwalten!'
        remote_lore:
          - ''
          - ' <#5db5f1>ℹ <smallcaps>Info</smallcaps>:'
          - '  <dark_gray>• <white>Mob: <yellow>{entity}'
          - '  <dark_gray>• <white>Stapel: <yellow>{size}'
          - '  <dark_gray>• <white>Status: {status}'
          - '  <dark_gray>• <white>Letzter Spieler: <yellow>{last_player}'
          - '  <dark_gray>• <white>Position: <gray>x: {x}, y: {y}, z: {z}'
          - ''
          - '<#ff6b6b> ⚠ Spawner auf anderen Servern lassen sich nicht verwalten!'
        last_player_none: 'Keiner'
        status:
          active: '<#00e689>Aktiv'
          inactive: '<#ff6b6b>Inaktiv'

    manage:
      title: '<smallcaps>Spawner verwalten</smallcaps>'
      teleport:
        name: '<white><smallcaps>Zum Spawner</smallcaps> <#5db5f1><smallcaps>teleportieren</smallcaps>'
        lore:
          - '<#5db5f1> ▸ <white>Klicke zum Teleportieren!'
      open_spawner:
        name: '<#5db5f1><smallcaps>Spawner-Menü</smallcaps> <white><smallcaps>öffnen</smallcaps>'
        lore:
          - '<#5db5f1> ▸ <white>Klicke, um das Menü zu öffnen!'
      remove:
        name: '<#ff6b6b><smallcaps>Spawner</smallcaps> <white><smallcaps>entfernen</smallcaps>'
        lore:
          - '<#ff6b6b> ▸ <white>Klicke, um diesen Spawner zu entfernen!'

  # {current_page} {total_pages} {item_name} {price} {price_source} {custom_price} {shop_price}
  prices:
    title: '[{current_page}/{total_pages}] <smallcaps>Verkaufspreise</smallcaps>'
    item:
      name: '<white>{item_name} <#5db5f1><smallcaps>Preis</smallcaps>'
      lore:
        - ''
        - ' <#5db5f1>ℹ <smallcaps>Info</smallcaps>:'
        - '  <dark_gray>• <white>Preis pro Stück: <green>{price} Moneten'
        - '  <dark_gray>• <white>Quelle: <yellow>{price_source}'
        - '  <dark_gray>• <white>Shop-Preis: <green>{shop_price} Moneten'

  # {entry} {label} {item} {amount} {chance} {durability} {max}
  editloot:
    mob_loot_title: '<smallcaps>Mob-Loot</smallcaps> • {entry}'
    item_loot_title: '<smallcaps>Item-Loot</smallcaps> • {entry}'
    capture_add_title: '<smallcaps>Item zum Hinzufügen ablegen</smallcaps>'
    capture_replace_title: '<smallcaps>Neues Item ablegen</smallcaps>'

    loot_entry:
      name: '<white><smallcaps>Loot</smallcaps> <#37eb9a>{label}'
      lore:
        - ''
        - ' <#37eb9a>ℹ <smallcaps>Info</smallcaps>:'
        - '  <dark_gray>• <white>Item: <yellow>{item}'
        - '  <dark_gray>• <white>Menge: <yellow>{amount}'
        - '  <dark_gray>• <white>Chance: <yellow>{chance}%'
        - '  <dark_gray>• <white>Haltbarkeit: <yellow>{durability}'
        - ''
        - '<#37eb9a> ▸ <white>Linksklick: Werte bearbeiten!'
        - '<#37eb9a> ▸ <white>Rechtsklick: Item ändern!'

    loot_broken:
      name: '<white><smallcaps>Loot</smallcaps> <#ff6b6b>{label}'
      lore:
        - ''
        - ' <#ff6b6b>⚠ <smallcaps>Achtung</smallcaps>:'
        - '  <dark_gray>• <white>Dieses Item ist nicht lesbar.'
        - '  <dark_gray>• <white>Wert: <yellow>{item}'
        - ''
        - '<#ff6b6b> ▸ <white>Rechtsklick: neues Item setzen!'

    add_loot:
      name: '<#37eb9a><smallcaps>Loot</smallcaps> <white><smallcaps>hinzufügen</smallcaps>'
      lore:
        - ''
        - ' <#37eb9a>ℹ <smallcaps>Info</smallcaps>:'
        - '  <dark_gray>• <white>Weiteres Loot-Item hinzufügen.'
        - ''
        - '<#37eb9a> ▸ <white>Klicke, um ein Item zu wählen!'

    capture_hint:
      name: '<white><smallcaps>Item in die</smallcaps> <#5db5f1><smallcaps>Mitte legen</smallcaps>'
      lore:
        - ''
        - ' <#5db5f1>ℹ <smallcaps>Info</smallcaps>:'
        - '  <dark_gray>• <white>Das Item wird genau so gespeichert.'
        - '  <dark_gray>• <white>Du bekommst es beim Verlassen zurück.'

    cancel:
      name: '<#ff6b6b><smallcaps>Aufnahme</smallcaps> <white><smallcaps>abbrechen</smallcaps>'
      lore:
        - ''
        - ' <#ff6b6b>ℹ <smallcaps>Info</smallcaps>:'
        - '  <dark_gray>• <white>Diese Aufnahme verwerfen.'
        - ''
        - '<#ff6b6b> ▸ <white>Klicke zum Abbrechen!'

    confirm:
      name: '<#37eb9a><smallcaps>Item</smallcaps> <white><smallcaps>bestätigen</smallcaps>'
      lore:
        - ''
        - ' <#37eb9a>ℹ <smallcaps>Info</smallcaps>:'
        - '  <dark_gray>• <white>Weiter zu Menge und Chance.'
        - ''
        - '<#37eb9a> ▸ <white>Klicke zum Fortfahren!'

    # Text inside the loot settings dialog. Keep it short.
    dialog_title:
      name: '<smallcaps>Loot-Einstellungen</smallcaps>'
    dialog_body:
      name: '<gray>Menge und Haltbarkeit erlauben Bereiche wie <white>0-2<gray>.'
    dialog_save:
      name: '<green>✔ <white>Speichern'
    dialog_cancel:
      name: '<red>← <white>Abbrechen'
    dialog_delete:
      name: '<dark_red>✖ <white>Loot löschen'
    field_amount:
      name: 'Menge (z. B. 1 oder 0-2)'
    field_chance:
      name: 'Chance % (0-100)'
    field_durability:
