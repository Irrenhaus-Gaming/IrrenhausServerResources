############################
# 
# ITSME.TO - A configuration for quests
# discord.gg/itsme-to
#
############################

tasks:
  misc:
    type: "playtime"
    minutes: 720
display:
  name: "&6Verschiedene Quests • 12 Stunden"
  lore-normal:
  - "%itsmyconfig_dark-color_console%Schließe die angegebene Aufgabe ab"
  - "%itsmyconfig_dark-color_console%um deine Belohnung zu erhalten."
  - ""
  - "%itsmyconfig_darkest-color_console%Information:"
  - "%itsmyconfig_text-color_console% • Ziel: %itsmyconfig_secondary-color_console%Sei für 12 Stunden online"
  - "%itsmyconfig_text-color_console% • Fortschritt: %itsmyconfig_primary-color_console%{misc:progress}%itsmyconfig_dark-color_console%/720 Minuten"
  - "%itsmyconfig_text-color_console% • Belohnung: %itsmyconfig_eco-format_console_{itsmyconfig_price-modifier_3000}%"
  - ""
  type: "CLOCK"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "$<p:text-color> • Schließe diese Quest ab, um <p:eco-format:'<p:price-modifier:3000>'> zu erhalten."
rewards:
- "eco give {player} %itsmyconfig_price-modifier_3000%"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "$<p:text-color> • <p:eco-format:'<p:price-modifier:3000>'> wurde deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "misc"
  requires:
  - "misc-01-online-3"
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 13
placeholders:
  description: "Sei für 12 Stunden online"
  progress: '{misc:progress}'
  max: ''
