tasks:
  pufferfish:
    type: "fishingcertain"
    item: PUFFERFISH
    amount: 20
display:
  name: "&3Angelquest • Kugelfisch #4"
  lore-normal:
  - "%itsmyconfig_dark-color_console%Angel die angegebene Anzahl an"
  - "%itsmyconfig_dark-color_console%Fischen, um deine Belohnung zu erhalten."
  - ""
  - "%itsmyconfig_darkest-color_console%Information:"
  - "%itsmyconfig_text-color_console% • Ziel: %itsmyconfig_secondary-color_console%Fange 20 Kugelfisch"
  - "%itsmyconfig_text-color_console% • Fortschritt: %itsmyconfig_primary-color_console%{pufferfish:progress}%itsmyconfig_dark-color_console%/20 Kugelfisch"
  - "%itsmyconfig_text-color_console% • Belohnung: %itsmyconfig_eco-format_console_{itsmyconfig_price-modifier_750}%"
  - ""
  type: "PUFFERFISH"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "$<p:text-color> • Schließe diese Quest ab, um <p:eco-format:'<p:price-modifier:750>'> zu erhalten."
rewards:
- "eco give {player} %itsmyconfig_price-modifier_750%"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "$<p:text-color> • <p:eco-format:'<p:price-modifier:750>'> wurde deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "fishing"
  requires:
  - "fishing-04-pufferfish-3"
  repeatable: false
  cooldown:
    enabled: true
    time: 82000
  sort-order: 43
placeholders:
  description: "Fange 20 Kugelfisch"
  progress: '{pufferfish:progress}'
  max: '20'
