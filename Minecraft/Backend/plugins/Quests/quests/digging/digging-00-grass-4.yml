tasks:
  dig:
    type: "blockbreakcertain"
    amount: 256
    block: GRASS_BLOCK
    reverse-if-placed: true
display:
  name: "&eGrabquest • Grasblock #4"
  lore-normal:
  - "__STYLE_DARK__Grabe die erforderliche Menge an"
  - "__STYLE_DARK__Blöcken aus, um deine Belohnung zu bekommen."
  - ""
  - "__STYLE_DARKEST__Information:"
  - "__STYLE_TEXT__ • Ziel: __STYLE_SECONDARY__Grabe 256 Grasblock aus"
  - "__STYLE_TEXT__ • Fortschritt: __STYLE_PRIMARY__{dig:progress}__STYLE_DARK__/256 Grasblock"
  - "__STYLE_TEXT__ • Belohnung: __REWARD_MONEY_TEXT_1000__"
  - ""
  type: "GRASS_BLOCK"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "__STYLE_TEXT__ • Schließe diese Quest ab, um __REWARD_MONEY_TEXT_1000__ __STYLE_TEXT__zu erhalten."
rewards:
- "moneten give {player} __REWARD_MONEY_1000__ -s"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "__STYLE_TEXT__ • __REWARD_MONEY_TEXT_1000__ __STYLE_TEXT__wurde deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "digging"
  requires:
  - "digging-00-grass-3"
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 3
placeholders:
  description: "Grabe 256 Grasblock aus"
  progress: '{dig:progress}'
  max: '256'
