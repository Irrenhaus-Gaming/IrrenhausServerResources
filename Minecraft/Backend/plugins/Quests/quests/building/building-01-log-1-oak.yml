tasks:
  build:
    type: "blockplacecertain"
    amount: 128
    block: "OAK_LOG"
    reverse-if-broken: true
display:
  name: "&2Bauquest • Eichenstamm"
  lore-normal:
  - "%itsmyconfig_dark-color_console%Platziere die notwendige Anzahl von"
  - "%itsmyconfig_dark-color_console%Blöcken, um deine Belohnung zu erhalten."
  - ""
  - "%itsmyconfig_darkest-color_console%Information:"
  - "%itsmyconfig_text-color_console% • Ziel: %itsmyconfig_secondary-color_console%Platziere 128 Eichenstamm"
  - "%itsmyconfig_text-color_console% • Fortschritt: %itsmyconfig_primary-color_console%{build:progress}%itsmyconfig_dark-color_console%/128 Eichenstamm"
  - "%itsmyconfig_text-color_console% • Belohnung: %itsmyconfig_eco-format_console_{itsmyconfig_price-modifier_500}%"
  - ""
  type: "OAK_LOG"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "$<p:text-color> • Schließe diese Quest ab, um <p:eco-format:'<p:price-modifier:500>'> zu erhalten."
rewards:
- "eco give {player} %itsmyconfig_price-modifier_500%"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "$<p:text-color> • <p:eco-format:'<p:price-modifier:500>'> wurde deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "building"
  requires: []
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 100
placeholders:
  description: "Platziere 128 Eichenstamm"
  progress: '{build:progress}'
  max: '128'
