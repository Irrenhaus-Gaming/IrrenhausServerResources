tasks:
  crafting:
    type: "crafting"
    item: HEAVY_WEIGHTED_PRESSURE_PLATE
    amount: 32
display:
  name: "&fHandwerksquest • Grobwägeplatte"
  lore-normal:
  - "%itsmyconfig_dark-color_console%Stelle die benötigte Anzahl an"
  - "%itsmyconfig_dark-color_console%Gegenständen her, um deine Belohnung zu erhalten."
  - ""
  - "%itsmyconfig_darkest-color_console%Information:"
  - "%itsmyconfig_text-color_console% • Ziel: %itsmyconfig_secondary-color_console%Stelle 32 Grobwägeplatte her"
  - "%itsmyconfig_text-color_console% • Fortschritt: %itsmyconfig_primary-color_console%{crafting:progress}%itsmyconfig_dark-color_console%/32 Grobwägeplatte"
  - "%itsmyconfig_text-color_console% • Belohnung: %itsmyconfig_eco-format_console_{itsmyconfig_price-modifier_150}%"
  - ""
  type: "HEAVY_WEIGHTED_PRESSURE_PLATE"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "$<p:text-color> • Schließe diese Quest ab, um <p:eco-format:'<p:price-modifier:150>'> zu erhalten."
rewards:
- "eco give {player} %itsmyconfig_price-modifier_150%"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "$<p:text-color> • <p:eco-format:'<p:price-modifier:150>'> wurde deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "crafting"
  requires: []
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 340
placeholders:
  description: "Stelle 32 Grobwägeplatte her"
  progress: '{crafting:progress}'
  max: '32'
