tasks:
  brew:
    type: "brewing"
    amount: 10
display:
  name: "&eBrauenquest • Trank #2"
  lore-normal:
  - "__STYLE_DARK__Braue die angegebene Anzahl von"
  - "__STYLE_DARK__Tränken, um deine Belohnung zu erhalten."
  - ""
  - "__STYLE_DARKEST__Information:"
  - "__STYLE_TEXT__ • Ziel: __STYLE_SECONDARY__Braue 10 Trank"
  - "__STYLE_TEXT__ • Fortschritt: __STYLE_PRIMARY__{brew:progress}__STYLE_DARK__/10 Trank"
  - "__STYLE_TEXT__ • Belohnung: __REWARD_MONEY_TEXT_350__"
  - ""
  type: "POTION"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "__STYLE_TEXT__ • Schließe diese Quest ab, um __REWARD_MONEY_TEXT_350__ __STYLE_TEXT__zu erhalten."
rewards:
- "moneten give {player} __REWARD_MONEY_350__ -s"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "__STYLE_TEXT__ • __REWARD_MONEY_TEXT_350__ __STYLE_TEXT__wurde deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "brewing"
  requires:
  - "brewing-00-potions-1"
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 1
placeholders:
  description: "Braue 10 Trank"
  progress: '{brew:progress}'
  max: '10'
