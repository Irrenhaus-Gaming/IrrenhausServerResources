tasks:
  bake:
    type: "crafting"
    item: PUMPKIN_PIE
    amount: 25
display:
  name: "&dLandwirtschaftsquest • Kürbiskuchen. #4"
  lore-normal:
  - "%itsmyconfig_dark-color_console%Backe die erforderliche Menge an"
  - "%itsmyconfig_dark-color_console%Ressourcen, um deine Belohnung zu erhalten."
  - ""
  - "%itsmyconfig_darkest-color_console%Information:"
  - "%itsmyconfig_text-color_console% • Ziel: %itsmyconfig_secondary-color_console%Backe 25 Kürbiskuchen"
  - "%itsmyconfig_text-color_console% • Fortschritt: %itsmyconfig_primary-color_console%{bake:progress}%itsmyconfig_dark-color_console%/25 Kürbiskuchen"
  - "%itsmyconfig_text-color_console% • Belohnung: %itsmyconfig_eco-format_console_{itsmyconfig_price-modifier_900}%"
  - ""
  type: "PUMPKIN_PIE"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "$<p:text-color> • Schließe diese Quest ab, um <p:eco-format:'<p:price-modifier:900>'> zu erhalten."
rewards:
- "eco give {player} %itsmyconfig_price-modifier_900%"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "$<p:text-color> • <p:eco-format:'<p:price-modifier:900>'> wurde deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "farming"
  requires:
  - "farming-11-pumpkin-pie-3"
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 113
placeholders:
  description: "Backe 25 Kürbiskuchen"
  progress: '{bake:progress}'
  max: '25'
