tasks:
  obtain:
    type: "inventory"
    item: WHITE_WOOL
    amount: 100
    remove-items-when-complete: false
    allow-partial-completion: true
    update-progress: true
display:
  name: "&dLandwirtschaftsquest • Weiße Wolle #2"
  lore-normal:
  - "__STYLE_DARK__Sammle die erforderliche Menge an"
  - "__STYLE_DARK__Ressourcen, um deine Belohnung zu bekommen."
  - ""
  - "__STYLE_DARKEST__Information:"
  - "__STYLE_TEXT__ • Ziel: __STYLE_SECONDARY__Sammle 100 Weiße Wolle"
  - "__STYLE_TEXT__ • Fortschritt: __STYLE_PRIMARY__{obtain:progress}__STYLE_DARK__/100 Weiße Wolle"
  - "__STYLE_TEXT__ • Belohnung: __REWARD_MONEY_TEXT_500__"
  - ""
  type: "WHITE_WOOL"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "__STYLE_TEXT__ • Schließe diese Quest ab, um __REWARD_MONEY_TEXT_500__ __STYLE_TEXT__zu erhalten."
rewards:
- "moneten give {player} __REWARD_MONEY_500__ -s"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "__STYLE_TEXT__ • __REWARD_MONEY_TEXT_500__ __STYLE_TEXT__wurde deinem In-Game-Guthaben hinzugefügt."

