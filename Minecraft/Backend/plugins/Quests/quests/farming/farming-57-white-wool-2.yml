  requires:
  - "farming-57-white-wool-1"
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 571
placeholders:
  description: "Sammle 100 Weiße Wolle"
  progress: '{obtain:progress}'
  max: '100'
