tasks:
  plant:
    type: "blockplacecertain"
    amount: 64
    block: "OAK_SAPLING"
    reverse-if-placed: true
display:
  name: "&dLandwirtschaftsquest • Eichensetzling #2"
  lore-normal:
  - "%itsmyconfig_dark-color_console%Pflanze die notwendigen Ressourcen"
  - "%itsmyconfig_dark-color_console%um deine Belohnung zu erhalten."
  - ""
  - "%itsmyconfig_darkest-color_console%Information:"
  - "%itsmyconfig_text-color_console% • Ziel: %itsmyconfig_secondary-color_console%Pflanze 64 Eichensetzling"
  - "%itsmyconfig_text-color_console% • Fortschritt: %itsmyconfig_primary-color_console%{plant:progress}%itsmyconfig_dark-color_console%/64 Eichensetzling"
  - "%itsmyconfig_text-color_console% • Belohnung: %itsmyconfig_eco-format_console_{itsmyconfig_price-modifier_300}%"
  - ""
  type: "OAK_SAPLING"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "$<p:text-color> • Schließe diese Quest ab, um <p:eco-format:'<p:price-modifier:300>'> zu erhalten."
rewards:
- "eco give {player} %itsmyconfig_price-modifier_300%"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "$<p:text-color> • <p:eco-format:'<p:price-modifier:300>'> wurde deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "farming"
  requires:
  - "farming-51-oak-sapling-1"
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 511
placeholders:
  description: "Pflanze 64 Eichensetzling"
  progress: '{plant:progress}'
  max: '64'
