tasks:
  smelting:
    type: "smeltingcertain"
    amount: 256
    item: GOLD_INGOT
display:
  name: "&cSchmelzquest • Rohgold #2"
  lore-normal:
  - "%itsmyconfig_dark-color_console%Schmelze die angegebene Anzahl an"
  - "%itsmyconfig_dark-color_console%Gegenständen, um deine Belohnung zu bekommen."
  - ""
  - "%itsmyconfig_darkest-color_console%Information:"
  - "%itsmyconfig_text-color_console% • Ziel: %itsmyconfig_secondary-color_console%Schmelze 256 Rohgold"
  - "%itsmyconfig_text-color_console% • Fortschritt: %itsmyconfig_primary-color_console%{smelting:progress}%itsmyconfig_dark-color_console%/256 Rohgold"
  - "%itsmyconfig_text-color_console% • Belohnung: %itsmyconfig_eco-format_console_{itsmyconfig_price-modifier_375}%"
  - ""
  type: "RAW_GOLD"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "$<p:text-color> • Schließe diese Quest ab, um <p:eco-format:'<p:price-modifier:375>'> zu erhalten."
rewards:
- "eco give {player} %itsmyconfig_price-modifier_375%"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "$<p:text-color> • <p:eco-format:'<p:price-modifier:375>'> wurde deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "smelting"
  requires:
  - "smelting-02-raw-gold-1"
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 21
placeholders:
  description: "Schmelze 256 Rohgold"
  progress: '{smelting:progress}'
  max: '256'
