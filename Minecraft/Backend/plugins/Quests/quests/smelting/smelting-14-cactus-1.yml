  - "__STYLE_DARK__Gegenständen, um deine Belohnung zu bekommen."
  - ""
  - "__STYLE_DARKEST__Information:"
  - "__STYLE_TEXT__ • Ziel: __STYLE_SECONDARY__Schmelze 256 Kaktus"
  - "__STYLE_TEXT__ • Fortschritt: __STYLE_PRIMARY__{smelting:progress}__STYLE_DARK__/256 Kaktus"
  - "__STYLE_TEXT__ • Belohnung: __REWARD_MONEY_TEXT_175__"
  - ""
