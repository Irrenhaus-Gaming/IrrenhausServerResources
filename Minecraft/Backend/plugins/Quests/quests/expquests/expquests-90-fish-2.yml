# 
# ITSME.TO - A configuration for quests
# discord.gg/itsme-to
#
############################

tasks:
  fishing:
    type: "fishing"
    amount: 75
display:
  name: "&aEXP-Quest • Angeln #2"
  lore-normal:
  - "%itsmyconfig_dark-color_console%Angel die angegebene Anzahl an"
  - "%itsmyconfig_dark-color_console%Fischen, um deine Belohnung zu erhalten."
  - ""
  - "%itsmyconfig_darkest-color_console%Information:"
  - "%itsmyconfig_text-color_console% • Ziel: %itsmyconfig_secondary-color_console%Fange 75 Fische"
  - "%itsmyconfig_text-color_console% • Fortschritt: %itsmyconfig_primary-color_console%{fishing:progress}%itsmyconfig_dark-color_console%/75 Fische"
  - "%itsmyconfig_text-color_console% • Belohnung: %itsmyconfig_exp-format_console_315%."
  - ""
  type: "FISHING_ROD"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "$<p:text-color> • Schließe diese Quest ab, um <p:exp-format:315> zu erhalten."
rewards:
- "xp give {player} 315"
rewardstring:
- "$<p:text-color> • <p:exp-format:315> wurden deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "expquests"
  requires:
  - "expquests-90-fish-1"
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 901
placeholders:
  description: "Fange 75 Fische"
  progress: '{fishing:progress}'
  max: '75'
