tasks:
  fishing:
    type: "fishing"
    amount: 75
display:
  name: "&aEXP-Quest • Angeln #2"
  lore-normal:
  - "__STYLE_DARK__Angel die angegebene Anzahl an"
  - "__STYLE_DARK__Fischen, um deine Belohnung zu erhalten."
  - ""
  - "__STYLE_DARKEST__Information:"
  - "__STYLE_TEXT__ • Ziel: __STYLE_SECONDARY__Fange 75 Fische"
  - "__STYLE_TEXT__ • Fortschritt: __STYLE_PRIMARY__{fishing:progress}__STYLE_DARK__/75 Fische"
  - "__STYLE_TEXT__ • Belohnung: __REWARD_XP_TEXT_315__."
  - ""
  type: "FISHING_ROD"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "__STYLE_TEXT__ • Schließe diese Quest ab, um __REWARD_XP_TEXT_315__ __STYLE_TEXT__zu erhalten."
rewards:
- "minecraft:xp add {player} __REWARD_XP_315__ points"
rewardstring:
- "__STYLE_TEXT__ • __REWARD_XP_TEXT_315__ __STYLE_TEXT__wurden deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "expquests"
  requires:
  - "expquests-90-fish-1"
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 901
placeholders:
  description: "Fange 75 Fische"
  progress: '{fishing:progress}'
  max: '75'
