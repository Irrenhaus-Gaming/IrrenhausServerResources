  lore-normal:
  - "__STYLE_DARK__Ernte die erforderlichen Ressourcen"
  - "__STYLE_DARK__um deine Belohnung zu bekommen."
  - ""
  - "__STYLE_DARKEST__Information:"
  - "__STYLE_TEXT__ • Ziel: __STYLE_SECONDARY__Ernte 192 Bambus"
  - "__STYLE_TEXT__ • Fortschritt: __STYLE_PRIMARY__{harvest:progress}__STYLE_DARK__/192 Bambus"
  - "__STYLE_TEXT__ • Belohnung: __REWARD_XP_TEXT_315__."
  - ""
  type: "BAMBOO"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
