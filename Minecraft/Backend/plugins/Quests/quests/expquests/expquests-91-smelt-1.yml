tasks:
  smelting:
    type: "smelting"
    amount: 256
display:
  name: "&aEXP-Quest • Schmelzen #1"
  lore-normal:
  - "__STYLE_DARK__Schmelze die angegebene Anzahl an"
  - "__STYLE_DARK__Gegenständen, um deine Belohnung zu bekommen."
  - ""
  - "__STYLE_DARKEST__Information:"
  - "__STYLE_TEXT__ • Ziel: __STYLE_SECONDARY__Schmelze 256 Gegenstände"
  - "__STYLE_TEXT__ • Fortschritt: __STYLE_PRIMARY__{smelting:progress}__STYLE_DARK__/256 Gegenstände"
  - "__STYLE_TEXT__ • Belohnung: __REWARD_XP_TEXT_160__."
  - ""
  type: "FURNACE"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
