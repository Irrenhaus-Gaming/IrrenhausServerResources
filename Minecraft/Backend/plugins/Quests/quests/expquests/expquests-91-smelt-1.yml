- "minecraft:xp add {player} __REWARD_XP_160__ points"
rewardstring:
- "__STYLE_TEXT__ • __REWARD_XP_TEXT_160__ __STYLE_TEXT__wurden deinem In-Game-Guthaben hinzugefügt."

