tasks:
  cut:
    type: "blockbreakcertain"
    amount: 512
    block: BIRCH_LOG
    reverse-if-placed: true
display:
  name: "&aEXP-Quest • Birkenstamm"
  lore-normal:
  - "%itsmyconfig_dark-color_console%Baue eine bestimmte Anzahl von"
  - "%itsmyconfig_dark-color_console%Blöcken ab, um deine Belohnung zu bekommen."
  - ""
  - "%itsmyconfig_darkest-color_console%Information:"
  - "%itsmyconfig_text-color_console% • Ziel: %itsmyconfig_secondary-color_console%Fälle 512 Birkenstamm"
  - "%itsmyconfig_text-color_console% • Fortschritt: %itsmyconfig_primary-color_console%{cut:progress}%itsmyconfig_dark-color_console%/512 Birkenstamm"
  - "%itsmyconfig_text-color_console% • Belohnung: %itsmyconfig_exp-format_console_315%."
  - ""
  - "&c&nAchtung!!!"
  - "&c&oDeine Gegenstände werden aus deinem Inventar genommen"
  - ""
  type: "BIRCH_LOG"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "$<p:text-color> • Schließe diese Quest ab, um <p:exp-format:315> zu erhalten."
rewards:
- "xp give {player} 315"
rewardstring:
- "$<p:text-color> • <p:exp-format:315> wurden deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "expquests"
  requires: []
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 782
placeholders:
  description: "Fälle 512 Birkenstamm"
  progress: '{cut:progress}'
  max: '512'
