############################
# 
# ITSME.TO - A configuration for quests
# discord.gg/itsme-to
#
############################

tasks:
  harvest:
    type: "farming"
    amount: 200
    block: "POTATOES"
display:
  name: "&aEXP-Quest • Kartoffeln"
  lore-normal:
  - "%itsmyconfig_dark-color_console%Ernte die erforderlichen Ressourcen"
  - "%itsmyconfig_dark-color_console%um deine Belohnung zu bekommen."
  - ""
  - "%itsmyconfig_darkest-color_console%Information:"
  - "%itsmyconfig_text-color_console% • Ziel: %itsmyconfig_secondary-color_console%Ernte 200 Kartoffeln"
  - "%itsmyconfig_text-color_console% • Fortschritt: %itsmyconfig_primary-color_console%{harvest:progress}%itsmyconfig_dark-color_console%/200 Kartoffeln"
  - "%itsmyconfig_text-color_console% • Belohnung: %itsmyconfig_exp-format_console_160%."
  - ""
  type: "POTATO"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "$<p:text-color> • Schließe diese Quest ab, um <p:exp-format:160> zu erhalten."
rewards:
- "xp give {player} 160"
rewardstring:
- "$<p:text-color> • <p:exp-format:160> wurden deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "expquests"
  requires: []
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 200
placeholders:
  description: "Ernte 200 Kartoffeln"
  progress: '{harvest:progress}'
  max: '200'
