tasks:
  damage:
    type: "dealdamage"
    amount: 10000
display:
  name: "&4Unmögliche Quest • Schaden zufügen"
  lore-normal:
  - "__STYLE_DARK__Besiege die angegebenen Kreaturen"
  - "__STYLE_DARK__um deine Belohnung zu erhalten."
  - ""
  - "__STYLE_DARKEST__Information:"
  - "__STYLE_TEXT__ • Ziel: __STYLE_SECONDARY__Verursache 10000 Schaden"
  - "__STYLE_TEXT__ • Fortschritt: __STYLE_PRIMARY__{damage:progress}__STYLE_DARK__/10000 Schäden"
  - "__STYLE_TEXT__ • Belohnung: __REWARD_MONEY_TEXT_35000__"
  - ""
  type: "DIAMOND_SWORD"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "__STYLE_TEXT__ • Schließe diese Quest ab, um __REWARD_MONEY_TEXT_35000__ __STYLE_TEXT__zu erhalten."
rewards:
- "moneten give {player} __REWARD_MONEY_35000__ -s"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "__STYLE_TEXT__ • __REWARD_MONEY_TEXT_35000__ __STYLE_TEXT__wurde deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "impossible"
  requires: []
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 140
placeholders:
  description: "Verursache 10000 Schaden"
  progress: '{damage:progress}'
  max: '10000'
