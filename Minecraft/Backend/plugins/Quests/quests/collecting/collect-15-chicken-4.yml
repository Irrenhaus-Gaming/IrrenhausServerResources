  lore-normal:
  - "__STYLE_DARK__Sammle die erforderliche Menge an"
  - "__STYLE_DARK__Ressourcen, um deine Belohnung zu bekommen."
  - ""
  - "__STYLE_DARKEST__Information:"
  - "__STYLE_TEXT__ • Ziel: __STYLE_SECONDARY__Sammle 400 Rohes Hühnchen"
  - "__STYLE_TEXT__ • Fortschritt: __STYLE_PRIMARY__{collect:progress}__STYLE_DARK__/400 Rohes Hühnchen"
  - "__STYLE_TEXT__ • Belohnung: __REWARD_MONEY_TEXT_850__"
  - ""
  - "&c&nAchtung!!!"
  - "&c&oDeine Gegenstände werden aus deinem Inventar genommen"
  - ""
  type: "CHICKEN"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
