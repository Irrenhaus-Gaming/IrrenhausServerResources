blacklist: ['1.19']

tasks:
  collect:
    type: "inventory"
    item: TORCHFLOWER
    amount: 64
    remove-items-when-complete: false
    allow-partial-completion: true
    update-progress: true
display:
  name: "&aSammelquest • Fackellilie #2"
  lore-normal:
  - "%itsmyconfig_dark-color_console%Sammle die erforderliche Menge an"
  - "%itsmyconfig_dark-color_console%Ressourcen, um deine Belohnung zu bekommen."
  - ""
  - "%itsmyconfig_darkest-color_console%Information:"
  - "%itsmyconfig_text-color_console% • Ziel: %itsmyconfig_secondary-color_console%Sammle 64 Fackellilie"
  - "%itsmyconfig_text-color_console% • Fortschritt: %itsmyconfig_primary-color_console%{collect:progress}%itsmyconfig_dark-color_console%/64 Fackellilie"
  - "%itsmyconfig_text-color_console% • Belohnung: %itsmyconfig_eco-format_console_{itsmyconfig_price-modifier_450}%"
  - ""
  - "&c&nAchtung!!!"
  - "&c&oDeine Gegenstände werden aus deinem Inventar genommen"
  - ""
  type: "TORCHFLOWER"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "$<p:text-color> • Schließe diese Quest ab, um <p:eco-format:'<p:price-modifier:450>'> zu erhalten."
rewards:
- "eco give {player} %itsmyconfig_price-modifier_450%"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "$<p:text-color> • <p:eco-format:'<p:price-modifier:450>'> wurde deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "collecting"
  requires:
  - "collect-39-torchflower-1"
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 391
placeholders:
  description: "Sammle 64 Fackellilie"
  progress: '{collect:progress}'
  max: '64'
