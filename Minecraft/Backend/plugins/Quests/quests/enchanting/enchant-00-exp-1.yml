tasks:
  enchant:
    type: "expearn"
    amount: 160
display:
  name: "&5Verzauberungsquest • EP verdienen"
  lore-normal:
  - "__STYLE_DARK__Sammle die notwendige Menge an"
  - "__STYLE_DARK__Erfahrungspunkten, um deine Belohnung zu erhalten."
  - ""
  - "__STYLE_DARKEST__Information:"
  - "__STYLE_TEXT__ • Ziel: __STYLE_SECONDARY__Verdiene 10 Erfahrungsstufe"
  - "__STYLE_TEXT__ • Fortschritt: __STYLE_PRIMARY__{enchant:progress}__STYLE_DARK__/160 Erfahrungswelten"
  - "__STYLE_TEXT__ • Belohnung: __REWARD_MONEY_TEXT_500__"
  - ""
  type: "EXPERIENCE_BOTTLE"
  itemflags:  [ HIDE_ARMOR_TRIM, HIDE_ATTRIBUTES, HIDE_DESTROYS, HIDE_DYE, HIDE_ENCHANTS, HIDE_PLACED_ON, HIDE_POTION_EFFECTS, HIDE_UNBREAKABLE ]
# Here you can list messages which will be sent to the player (if they are online) upon the quest starting.
startstring:
- "__STYLE_TEXT__ • Schließe diese Quest ab, um __REWARD_MONEY_TEXT_500__ __STYLE_TEXT__zu erhalten."
rewards:
- "moneten give {player} __REWARD_MONEY_500__ -s"
# Here you can list messages which will be sent to the player (if they are online) upon completion.
rewardstring:
- "__STYLE_TEXT__ • __REWARD_MONEY_TEXT_500__ __STYLE_TEXT__wurde deinem In-Game-Guthaben hinzugefügt."

# These placeholders are accessible using PlaceholderAPI, for example %quests_tracked_p:description%
# They are useful for putting information about the players tracked quest on a scoreboard
# You may want to keep the names of them the same for ALL quests for this use-case


options:
  category: "enchanting"
  requires: []
  repeatable: false
  cooldown:
    enabled: true
    time: 82600
  sort-order: 0
placeholders:
  description: "Verdiene 10 Erfahrungsstufe"
  progress: '{enchant:progress}'
  max: '160'
