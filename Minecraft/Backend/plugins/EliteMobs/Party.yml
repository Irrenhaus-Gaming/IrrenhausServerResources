# Enables session-scoped player parties.
# Party membership is never saved and ends when players log out or leave.
enabled: true
# Maximum same-world distance in blocks for party loot voting and shared quest objective credit.
# This prevents remote or AFK party members from receiving progression.
sharedProgressRange: 128.0
# How long a party invitation remains valid.
inviteTimeoutSeconds: 60
# How long party members have to accept an instanced dungeon ready check.
dungeonReadyCheckTimeoutSeconds: 30
# Hard maximum lifetime for one party need/greed vote session.
# New party drops still refresh the normal 60-second voting window, but can never extend a session past this limit.
lootVoteMaximumLifetimeSeconds: 120
# Shows the combined party status and tracked quest sidebar while players are in a party.
# Disabling this keeps parties active and falls back to the normal EliteMobs quest scoreboard.
sidebarEnabled: true
# How often the party sidebar alternates between its invite and leave command hints.
sidebarRotationSeconds: 10
# Shows a short party invitation hint when a player right-clicks another player.
# This has no effect when the party system itself is disabled.
playerInteractionHintsEnabled: true
# Minimum time before a player can receive another right-click party hint.
playerInteractionHintCooldownSeconds: 300
