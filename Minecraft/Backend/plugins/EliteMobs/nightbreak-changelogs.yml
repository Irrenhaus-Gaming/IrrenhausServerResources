    targetVersion: 10.9.10
    releases:
    - version: 10.9.10
      changelog: |-
        EliteMobs 10.9.10:
        - [New] Added flight networks: flight masters and wormholes fly players between stations along node routes, built with the in-game /em transport editor.
        - [New] Wormholes can open flight menus, start instanced dungeons and work inside instanced dungeons.
        - [New] Added the Railboots enchantment. Double-tap sneak on a rail to ride a minecart down the track.
        - [New] Added PlaceholderAPI placeholders for the tracked quest and its objectives.
        - [New] Added allowDialogMenusForBedrockPlayers, which gives Bedrock players the dialog /em, quest and class menus on servers whose Geyser shows dialogs as forms.
        - [New] /em quest bypass now passes every content permission gate, including flight nodes, instanced dungeons, arenas and party rosters.
        - [New] Enchantments can now form item sets. A set: section lists the pieces, the set's effects only work while every piece is worn, and item lore shows the set with worn pieces in green and missing ones in red ($itemSet).
        - [New] Lua powers can spawn item and block display visuals with world:spawn_display_at_location (Bedrock players see an armor stand stand-in), and gain remove, set_invisible, set_silent and the armor stand methods set_marker, set_small, set_base_plate and set_arms.
        - [Tweak] Quest and boss tracking now follow moving targets, point at the wormhole that starts a target's dungeon and show a height arrow for far targets.
        - [Tweak] Combat labels ride the player again, and ride the vehicle while the player is mounted. Player names stay visible.
        - [Tweak] A natural elite spawn cancelled by another plugin is now reported once per mob type instead of on every spawn.
        - [Tweak] The setup menu's update buttons now explain restart-free updates, and content that isn't released yet says so.
        - [Tweak] Players now see at most three boss health bars, and bars beyond the first only come from bosses they are fighting.
        - [Fix] Players who die in a dungeon, arena or class trial come out at full health again.
        - [Fix] Older items that store their item level in an older format no longer switch off the effects of all EliteMobs gear.
        - [Fix] Speed and Slowness effects at 00:00 no longer get stuck on players.
        - [Fix] Staff and wand skill hits are no longer lost to the vanilla hit cooldown, so Starfall Volley lands all its bolts.
        - [Fix] A boss reinforcement blocked by a protection or mob-limit plugin no longer stops the boss's other powers, and script reinforcements share their summoner's protection bypass.
        - [Fix] Loud Strikes and other enchantment queries work during attacks from Mind-driven bosses.
        - [Fix] zombie_bloat releases the zombie after its blast again. Unedited copies of the old script are updated.
        - [Fix] Overhead boss health bars now move with their elite on Java instead of running ahead of it.
        - [Fix] Stopping or reloading the server with a phase boss inside a dungeon instance no longer breaks the next startup with "Duplicate ammunition owner".
        - [Fix] On Windows, a config file briefly locked by an antivirus or file indexer no longer stops EliteMobs from starting.
        - [Fix] Content package updates now archive files the new version no longer ships.
        - [Fix] /nightbreak plugins now installs missing plugins into plugins/, so they load on the next start.
        - [Fix] Restart-free updates no longer keep the old copy of EliteMobs in memory.
      releasedAt: '2026-10-17T16:21:06.409Z'
    complete: true
