    releases:
    - version: 2.12.9
      changelog: |-
        FreeMinecraftModels 2.12.9:
        - [New] Animations now blend. Idle and walk cross-fade, death fades in, and attacks follow Blockbench's Override setting and blend weight, on Java and Bedrock.
        - [New] Models now turn with inertia that scales with their size. Configure it with weightedTurning, turnSpeedCap and turnAcceleration.
        - [New] A prop's .yml name and lore now apply to its placement item. An empty lore list removes the default lore.
        - [New] Enchantments can now form item sets. A set: section lists the pieces, the set only takes effect while every piece is worn, including on staff and wand hits, and custom item lore shows the set's pieces.
        - [Fix] Model bones and nameplates now ride their entity, so mounts and moving models no longer trail or jerk behind their mob or rider.
        - [Fix] /fmm mount riders stay on their mount instead of being left behind.
        - [Fix] With Geyser installed, a mount no longer disappears for its own Java rider.
        - [Fix] A staff fireball's direct hit now deals full damage, and magic hits are no longer lost to the vanilla hit cooldown.
        - [Tweak] Staff fireballs fly faster, 0.48 blocks per tick instead of 0.38.
        - [Tweak] Nameplates of models without a name tag bone now sit just above the model.
        - [Fix] A broken prop recipe file now rejects only the recipes instead of failing FreeMinecraftModels startup.
        - [Tweak] The notice about particle components Java can't show yet is now an info line instead of a warning.
        - [Tweak] The setup menu's update buttons now explain restart-free updates.
        - [Fix] Textures whose image size differs from their UV size no longer turn into a flickering animation that shows the wrong half.
        - [Fix] On Windows, saving a config file that an antivirus or file indexer briefly holds open no longer fails.
        - [Fix] Content package updates now archive files the new version no longer ships.
        - [Fix] /nightbreak plugins now installs missing plugins into plugins/, so they load on the next start.
        - [Fix] Restart-free updates no longer keep the old copy of FreeMinecraftModels in memory.
      releasedAt: '2026-10-17T16:23:36.774Z'
