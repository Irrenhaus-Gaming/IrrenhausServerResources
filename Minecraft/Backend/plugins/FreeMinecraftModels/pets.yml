# Which kind of pet server this is. Also switchable from /fmm setup and /fmm petadmin mode.
# CREATURES (more creatures): pet species also spawn wild in the world and are tamed by feeding them.
# COSMETIC (cosmetic pets): only pets players own exist in the world; no wild spawns.
mode: CREATURES
# How many pets a player may have out at once. 0 means no limit.
maxEquippedPets: 1
# Whether owned pets ignore damage from players, their owner included. When false they are mortal,
# like tamed wolves. Pets are always invulnerable in COSMETIC mode.
petsInvulnerableToPlayers: true
# Whether a pet that dies leaves its owner's collection for good, as a tamed wolf does. When false it
# goes home until re-equipped.
petsDiePermanently: false
# CREATURES mode: wild pets live like vanilla's farm animals. They come with the world, stay where
# they are, wait while their chunk is unloaded and never despawn. This is the chance, 0 to 0.9, that
# a newly generated chunk gets a group of wild pets, rolled again after each group (vanilla's
# animals use 0.1, shared by every animal of the biome).
wildGenerationChance: 0.01
# CREATURES mode: ticks between top-up passes, which add wild pets around players where there are
# fewer than the cap, never closer than 24 blocks to a player. 400 is vanilla's pace for animals.
wildSpawnIntervalTicks: 400
# CREATURES mode: chance that a top-up pass tries a given chunk within 8 chunks of a player, 0 to 1.
# Vanilla tries every chunk (1); lower values refill an emptied area more slowly.
wildSpawnChunkChance: 0.01
# CREATURES mode: top-ups stop once this many wild pets of all species are within 8 chunks of a
# player, like a vanilla mob cap. Each species' wildSpawn.cap limits that species further. New
# chunks are stocked regardless.
wildPetCapPerPlayer: 6
tamedMessage: '&aYou tamed a $pet&a! It follows you now. The &fStallmeister &aat spawn
  looks after your pets.'
tameFailedMessage: '&7The $pet &7eats it, but is not tamed yet.'
stayMessage: '&7Your $pet &7stays here.'
followMessage: '&7Your $pet &7follows you again.'
menuTitle: '&2Your pets'
noPetsMessage: '&6[Stallmeister Anton] &fDu hast ja noch gar keine Haustiere! Zieh
  los und fang dir welche.'
equippedMessage: '&a$pet &ais with you.'
unequippedMessage: '&7$pet &7went home.'
maxEquippedMessage: '&cYou can only have one pet with you. Click your current pet to
  send it home first.'
breedingCooldownMessage: '&7Your $pet &7is not ready to breed again yet.'
bornMessage: '&aA $pet &awas born!'
migrations:
  rareFlockChance: 0.1
  # Night migrations: rare flocks of a migrating pet species crossing the night sky over players.
  # The members are wild pets of the species flying a migration route: same model and animations,
  # and in CREATURES mode a player who reaches one can tame it. They leave after durationSeconds.
  # A species migrates when it flies, its pet file has a migration: section, and migrate is among
  # its behaviors (the flying defaults include it); the console says when one cannot.
  enabled: true
  # Chance, 0 to 1, that a player gets a flock over them on a given night.
  chancePerNight: 0.15
  # Fewest and most creatures in one flock.
  minFlockSize: 8
  maxFlockSize: 14
  # Blocks above the higher of the player and the ground under them that the flock flies at.
  altitude: 28.0
  # Flock speed in blocks per tick (0.15 is 3 blocks a second).
  speed: 0.15
  # Seconds from the flock appearing to its removal. It passes over the player halfway through.
  durationSeconds: 90.0
  # Blocks from which players see a flock; well past the usual model view distance.
  # Clients still need the chunks the flock flies over within their render distance.
  viewDistance: 160
  # Most flocks in the air at once across the server.
  maxActiveFlocks: 3
  # Species ids that may migrate. Empty means every species that can (see enabled above).
  species: []
