# Master toggle for the optional furniture shop.
# Defaults to false; set to true to allow players to buy craftable items via /fmm shop.
# Requires Vault and a registered economy provider to be installed; the shop disables itself silently if either is missing.
enabled: false
# Default price applied to recipes that do not explicitly set a shopPrice.
# Existing recipe files without shopPrice will have this value written into them on next load.
defaultPrice: 100.0
# Title shown at the top of the shop inventory.
menuTitle: '&8FMM - Furniture Shop'
# Lore line appended to each shop item showing its price.
# Placeholders: {price}
priceLoreFormat: '&7Price: &e{price}'
# Lore line appended to each shop item prompting purchase.
clickToBuyLoreFormat: '&aClick to purchase'
messages:
  # Sent to the player after a successful purchase.
  # Placeholders: {item}, {price}, {balance}
  purchaseSuccess: '&aPurchased &f{item} &afor &e{price}&a. Balance: &e{balance}&a.'
  # Sent when the player cannot afford the clicked item.
  # Placeholders: {item}, {price}, {balance}
  insufficientFunds: '&cYou need &e{price} &cto buy &f{item}&c. Balance: &e{balance}&c.'
  # Sent when the shop is disabled (master toggle off, Vault missing, or no economy provider).
  # Players normally never see this — the command is unregistered when the shop is off — but it is shown if the shop is force-disabled at runtime.
  shopDisabled: '&cThe furniture shop is currently unavailable.'
  # Sent when a player clicks an item that is not for sale (recipe shopEnabled is false).
  # Placeholders: {item}
  itemNotForSale: '&cThat item is not currently for sale.'
  # Sent when the purchased item could not fit in the player's inventory and was dropped at their feet.
  # Placeholders: {item}
  inventoryFull: '&eYour inventory was full; &f{item} &ehas been dropped at your feet.'
