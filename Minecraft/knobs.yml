# Design and economy knobs, baked into the config files whenever they are rendered (deploy, boot
# test, mc render). Not secret: the values are committed and visible. Change a value here and the
# next deploy uploads every file whose rendered text changed (no restart: reload the plugin in game).
#
# Tokens in Minecraft/<source>/ files:
#   __STYLE_<NAME>__             style.<NAME>
#   __REWARD_<KIND>_<N>__        N * rewards.<KIND>.multiplier, rounded half up to a whole number
#   __REWARD_<KIND>_TEXT_<N>__   rewards.<KIND>.text with {amount} = that number and {<NAME>} = style.<NAME>
# <N> is the base amount written in the quest; KIND names contain no underscore.

style:
  PRIMARY: "&e"     # yellow: progress numbers, highlights
  SECONDARY: "&6"   # gold: quest goal
  TEXT: "&f"        # white: normal text
  DARK: "&7"        # gray: descriptions, separators
  DARKEST: "&8"     # dark gray: section headers

rewards:
  MONEY:            # ExcellentEconomy currency "moneten"
    multiplier: 3
    text: "{PRIMARY}{amount} Moneten"
  XP:               # vanilla experience points
    multiplier: 1
    text: "&#F15BB5{amount}◎"

# EconomyShopGUI admin shop (generated from Minecraft/shop/, see its README). Every item has a value V:
# the fair price between players, per item. The shop sells above it and buys far below it, so trading
# with another player is always better than trading with the shop.
#   buy  = V * markup * rarity[item rarity] * multiplier   (rounded up)
#   sell = V * sell_ratio[class] * multiplier               (rounded down; crafted items never sell
#                                                            for more than their ingredients)
# Lint enforces markup >= 1.5, every sell ratio <= 0.35, and buy >= 3 * sell for every item.
shop:
  multiplier: 1       # scales every shop price at once
  markup: 2           # shop price = twice the player price
  craft_factor: 1.05  # a crafted item's value: its ingredients' values * this (work done)
  rarity:             # vanilla rarity component; a small premium on the buy price only
    common: 1
    uncommon: 1.15
    rare: 1.3
    epic: 1.5
  sell_ratio:         # what the shop pays, as a share of V
    auto: 0.05        # fully AFK-farmable (iron/gold/mob/crop farms, raids): token amounts only
    farm: 0.15        # renewable, but needs a player working
    mined: 0.3        # mined or found by hand, not farmable
    none: 0           # the shop never buys it back
  spawner_income_cap: 50  # Moneten/h one SmartSpawner spawner may earn by selling its loot here (lint)
