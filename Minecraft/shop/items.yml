# Admin shop price list (EconomyShopGUI). The knobs that turn values into prices are in
# Minecraft/knobs.yml -> shop; the menu is in layout.yml. See README.md in this folder.
#
# A value is the fair price of ONE item between players, in Moneten. Anchors: cobblestone 1,
# iron ingot 30, diamond 500. Only base items get a value here; everything craftable is priced
# from its cheapest vanilla recipe (vanilla.lock.yml), so an iron block always costs 9 ingots.
# Item ids may be globs ("*_concrete"); an exactly named item wins over a glob, a more specific
# glob (more fixed characters) over a looser one.
#
# The group an item is in decides what the shop pays for it (knobs.yml shop.sell_ratio):
#   auto   anything a farm produces without a player (iron golems, crops with observers, mob
#          grinders, raids, gold/piglin farms, bone meal, fishing AFK): token sell price only.
#          Future spawner plugins (SmartSpawner sells loot at shop prices) stay harmless this way.
#   farm   renewable but a player has to do the work
#   mined  found or mined by hand
#   none   the shop sells it but never buys it back (infinite generators, trivial items)

# Never priced, never in the shop (creative-only, technical, unobtainable or broken in a shop).
exclude:
  - air
  - barrier
  - bedrock
  - "*command_block*"
  - debug_stick
  - jigsaw
  - knowledge_book
  - light
  - structure_block
  - structure_void
  - test_block
  - test_instance_block
  - end_portal_frame
  - reinforced_deepslate
  - budding_amethyst
  - spawner
  - trial_spawner
  - vault
  - "infested_*"
  - farmland
  - dirt_path
  - petrified_oak_slab
  - frogspawn
  - "suspicious_*"
  - chipped_anvil
  - damaged_anvil
  - "*_spawn_egg"           # spawn eggs are decided later (custom entries below can sell them)
  - "*_map"                 # explorer maps / filled maps: item data the shop cannot set
  - filled_map
  - written_book
  - writable_book
  - enchanted_book          # no enchanted books: villager trading halls should matter
  - potion                  # without a potion type these are water bottles at best
  - splash_potion
  - lingering_potion
  - tipped_arrow
  - firework_star
  - firework_rocket
  - player_head
  - "*fish_bucket"          # buckets of mobs, water, lava and powder snow (milk is fine)
  - axolotl_bucket
  - cod_bucket
  - salmon_bucket
  - tadpole_bucket
  - sulfur_cube_bucket
  - powder_snow_bucket
  - lava_bucket
  - water_bucket
  - "*_golem_statue"
  - "*copper_golem_statue"
  - chorus_plant
  - "*_banner_pattern"      # patterns are loot/rewards
  - goat_horn               # instrument variants are item data

# Priced (so crafted items get a value), but not in the shop yet: neither bought nor sold.
# Anything crafted from these is held back too. Endgame goods are decided later.
held_back:
  - elytra
  - nether_star
  - totem_of_undying
  - enchanted_golden_apple
  - dragon_egg
  - dragon_head
  - dragon_breath
  - heavy_core
  - trident
  - heart_of_the_sea
  - shulker_shell
  - echo_shard
  - ancient_debris
  - netherite_scrap
  - netherite_ingot
  - "*_smithing_template"
  - "music_disc_*"
  - disc_fragment_5
  - experience_bottle
  - sniffer_egg
  - ominous_bottle
  - ominous_trial_key
  - trial_key
  - "*_pottery_sherd"
  - wither_skeleton_skull
  - "*_horse_armor"
  - "*_nautilus_armor"
  - "chainmail_*"
  - bell
  - "spawner_*"             # custom spawner entries below

