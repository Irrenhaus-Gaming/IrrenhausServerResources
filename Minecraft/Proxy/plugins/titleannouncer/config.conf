# TitleAnnouncer | by 4drian3d

# Actionbar Messages
actionbar {
    announce-sent="<green>The actionbar announcement has been sent successfully"
}
# Bossbar Messages
bossbar {
    announce-sent="<green>The bossbar announcement has been sent successfully"
    invalid-color="<red>Invalid color provided"
    invalid-overlay="<red>Invalid overlay provided"
}
# Chat Messages
chat {
    announce-sent="<green>The chat announcement has been sent successfully"
}
# Error sending if no valid target is detected to send the announcement to
invalid-target="<red>You have provided an invalid target"
# Reload Messages
reload {
    error-while-reloading-configuration="<red>An error occurred while reloading the configuration. Check the console for more information"
    successfully-reloaded="<green>Successful configuration reload"
}
# Sound announcements default values configuration
sound {
    # Default pitch to use
    default-pitch=1
    # Default Sound source to play in
    default-source=MASTER
    # Default volume to use
    default-volume=1
    invalid-sound-provided="<dark_red><sound> <red>is not a valid sound"
    playing-sound="<aqua>Playing '<gold><sound>' sound"
}
# Title announcements default values configuration
title {
    announce-sent="<green>The title announcement has been sent successfully"
    # Default fade-in value, in milliseconds
    default-fade-in=500
    # Default fade-out value, in milliseconds
    default-fade-out=1000
    # Default stay value, in milliseconds
    default-stay=2000
}
