# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Header-&-Footer
header-footer:
  enabled: true
  designs:
    world-test:
      display-condition: "%world%=test"
      header:
        - "Test header in world 'test'"
      footer:
        - "Test footer in world 'test'"
    default:
      header:
        - "<#FFFFFF>&m                                                </#FFFF00>"
        - "&3&lIrrenhaus"
        - "&r&7&l>> %animation:Welcome%&3 &l%player%&7&l! &7&l<<"
        - "&r&7Online players: &f%online%"
        - "&6Online staff: &e%staffonline%"
        - ""
      footer:
        - ""
        - "&r&7Schaut im discord vorbei"
        - "%animation:web%"
        - "<#FFFFFF>&m                                                </#FFFF00>"

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Tablist-name-formatting
tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Nametags
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  # https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Sorting-players-in-tablist
  sorting-types:
    - "GROUPS:owner,admin,mod,helper,builder,vip,default"
    - "PLACEHOLDER_A_TO_Z:%player%"
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Playerlist-Objective
playerlist-objective:
  enabled: true
  value: "%ping%"
  fancy-value: "&7Ping: %ping%"
  title: "TAB" # Only visible on Bedrock Edition
  render-type: INTEGER
  disable-condition: '%world%=disabledworld'

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Belowname
belowname-objective:
  enabled: true
  value: "%player_health_rounded%"
  fancy-value: "&c%player_health_rounded%"
  fancy-value-default: "NPC"
  title: "&cHealth"
  disable-condition: '%world%=disabledworld'
  view-distance: 10

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Spectator-fix
prevent-spectator-effect:
  enabled: false

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Bossbar
bossbar:
  enabled: true
  toggle-command: /bossbar
  remember-toggle-choice: true
  hidden-by-default: false
  bars:
    ServerInfo:
      style: "PROGRESS" # for 1.9+: PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
      color: "%animation:barcolors%" # for 1.9+: BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
      progress: "%animation:bossbar-progress%" # in %
      text: "&f&ddiscord.irrenhaus-gaming.de"
      display-condition: "%animation:bossbar-toggle%=ON"

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Scoreboard
scoreboard:
  enabled: true
  toggle-command: /qd
  remember-toggle-choice: true
  hidden-by-default: false
  delay-on-join-milliseconds: 5000
  scoreboards:
    # 0) EliteMobs-Quest (allein, oder Phase 2 beim Abwechseln)
    #    MUSS ganz oben stehen
    elitemobs-quest:
      display-condition: "em-zeigen"
      title: "%condition:em-titel%"
      lines:
        - "%condition:em-zeile1%"
        - "%condition:em-zeile2%"

    # 1) Verfolgte Quest ist abgeschlossen
    quest-completed:
      display-condition: "sb-quest-completed"
      title: "<#55FF55>Quest abgeschlossen</#00AA00>"
      lines:
        - "&a&l%quests_tracked_p:description%"
        - "&7Fortschritt||&a%quests_tracked_p:progress%&7/%quests_tracked_p:max%"

    # 2) Verfolgte NPC-Quest mit Zeitlimit
    npcquest-timelimit:
      display-condition: "sb-npcquest-timelimit"
      title: "<#E0B11E>Aktive Quest</#FFD700>"
      lines:
        - "&7%quests_tracked_p:description%"
        - "&7Ziel||&b%quests_tracked_p:target%"
        - "&7Fortschritt||&f%quests_tracked_p:progress%&7/%quests_tracked_p:max%"
        - "&7Restzeit||&f%quests_tracked_timeleft%"

    # 3) Verfolgte NPC-Quest ohne Zeitlimit
    npcquest-notimelimit:
      display-condition: "sb-npcquest-notimelimit"
      title: "<#E0B11E>Aktive Quest</#FFD700>"
      lines:
        - "&7%quests_tracked_p:description%"
        - "&7Ziel||&b%quests_tracked_p:target%"
        - "&7Fortschritt||&f%quests_tracked_p:progress%&7/%quests_tracked_p:max%"

    # 4) Verfolgte Quest hat ein Zeitlimit (nicht NPC)
    quest-timelimit:
      display-condition: "sb-quest-timelimit"
      title: "<#E0B11E>Aktive Quest</#FFD700>"
      lines:
        - "&7%quests_tracked_p:description%"
        - "&7Fortschritt||&f%quests_tracked_p:progress%&7/%quests_tracked_p:max%"
        - "&7Restzeit||&f%quests_tracked_timeleft%"

    # 5) Verfolgte Quest ohne Zeitlimit (nicht NPC)
    quest-notimelimit:
      display-condition: "sb-quest-notimelimit"
      title: "<#E0B11E>Aktive Quest</#FFD700>"
      lines:
        - "&7%quests_tracked_p:description%"
        - "&7Fortschritt||&f%quests_tracked_p:progress%&7/%quests_tracked_p:max%"

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Layout
layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:37e93c8e12cd426cb28fce31969e0674
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 1000
  layouts:
    default:
      slot-count: 80
      fixed-slots:
        - '1|&3Website&f:'
        - '2|&bmyserver.net'
        - '3|&8&m                       '
        - '4|&3Name&f:'
        - '5|&b%player%'
        - '7|&3Rank&f:'
        - '8|Rank: %group%'
        - '10|&3World&f:'
        - '11|&b%world%'
        - '13|&3Time&f:'
        - '14|&b%time%'
        - '21|&3Teamspeak&f:'
        - '22|&bts.myserver.net'
        - '23|&8&m                       '
        - '41|&3Store&f:'
        - '42|&bshop.myserver.net'
        - '43|&8&m                       '
      groups:
        staff:
          display-condition: permission:tab.staff
          slots:
            - 24-40
        players:
          slots:
            - 44-80

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Ping-Spoof
ping-spoof:
  enabled: false
  value: 0

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Global-playerlist
global-playerlist:
  enabled: true
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  update-latency: false
  spy-servers:
    - spyserver1
    - spyserver2
  server-groups:
    lobbies:
      - Lobby
    group2:
      - server1
      - server2

placeholders:
  date-format: "dd.MM.yyyy"
  time-format: "[HH:mm:ss / h:mm a]"
  time-offset: 0
  register-tab-expansion: false
  locale: en-US

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Placeholder-output-replacements
placeholder-output-replacements:
  "%essentials_vanished%":
    "yes": "&7| Vanished"
    "no": ""

# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Conditional-placeholders
conditions:
  nick: # use it with %condition:nick%
    conditions:
      - "%player%=%essentials_nickname%"
    true: "%player%"
    false: "~%essentials_nickname%"
  sb-quest-completed:
    type: AND
    conditions:
    - "%quests_tracked%!="
    - "%quests_tracked%!=No tracked quest"
    - "%quests_tracked_completed%=true"
  sb-npcquest-timelimit:
    type: AND
    conditions:
    - "%quests_tracked%!="
    - "%quests_tracked%!=No tracked quest"
    - "%quests_tracked_completed%=false"
    - "%quests_tracked_p:target%!="
    - "%quests_tracked_p:target%!<-not a valid placeholder"
    - "%quests_tracked_timeleft%!=No time limit"

  sb-npcquest-notimelimit:
    type: AND
    conditions:
    - "%quests_tracked%!="
    - "%quests_tracked%!=No tracked quest"
    - "%quests_tracked_completed%=false"
    - "%quests_tracked_p:target%!="
    - "%quests_tracked_p:target%!<-not a valid placeholder"

  sb-quest-timelimit:
    type: AND
    conditions:
    - "%quests_tracked%!="
    - "%quests_tracked%!=No tracked quest"
    - "%quests_tracked_completed%=false"
    - "%quests_tracked_timeleft%!=No time limit"

  sb-quest-notimelimit:
    type: AND
    conditions:
    - "%quests_tracked%!="
    - "%quests_tracked%!=No tracked quest"
    - "%quests_tracked_completed%=false"
    
  q-bereit:
    conditions:
      - "%quests_tracked%!="
      - "%quests_tracked%!=No tracked quest"
    type: AND

  # EliteMobs hat Vorrang, wenn keine normale Quest aktiv ist
  # ODER die Animation gerade auf Phase 2 steht
  em-vorrang:
    conditions:
      - "%condition:q-bereit%=false"
      - "%animation:QuestWechsel%=2"
    type: OR

  # EliteMobs-Board anzeigen?
  # (bei "Uninitialized player data!" direkt nach dem Join ist das automatisch false)
  em-zeigen:
    conditions:
      - "%elitemobs_quest_is_tracking%=yes"
      - "%condition:em-vorrang%=true"
    type: AND

  # Titel des EliteMobs-Boards (aktiv vs. abgeschlossen)
  em-titel:
    conditions:
      - "%elitemobs_quest_tracked_complete%=yes"
    true: "<#55FF55>Elite-Quest erledigt</#00AA00>"
    false: "<#FF5555>Elite-Quest</#AA0000>"

# ===== EliteMobs: nur offene Ziele anzeigen (max. 2) =====
  # Zeile 1 im Scoreboard: %condition:em-zeile1%
  em-zeile1:
    conditions:
      - "%elitemobs_quest_tracked_complete%=yes"
    true: "%elitemobs_quest_tracked_objective_1%"   # Quest fertig -> Abgabe-Hinweis
    false: "%condition:em-a1%"

  # Zeile 2 im Scoreboard: %condition:em-zeile2%
  em-zeile2:
    conditions:
      - "%elitemobs_quest_tracked_complete%=yes"
    true: ""
    false: "%condition:em-b1%"

  # em-aN = erstes offenes Ziel ab Ziel N
  em-a1:
