# Every placeholder used in Minecraft/<source>/ files must be declared here (mc lint enforces it).
#   kind:    secret -> GitHub secret,   written as __SECRET_<NAME>__
#            var    -> GitHub variable, written as __VAR_<NAME>__
#   sources: config folders under Minecraft/ whose files use it (Backend, Proxy).
#   scope:   where the value comes from:
#              repository  -> set once in the repository's Actions secrets, shared by every server
#              environment -> set in every server's own GitHub Environment (mc-proxy, mc-backend-<Name>)
#              collected   -> built by the workflow from the server environments (never set by hand)
#            GitHub resolves environment values before repository values with the same name.
#   mask:    keyed -> the secret is also an ordinary word; never replaced globally when masking
#   expand:  toml-entries -> list placeholder: a JSON object expanded into `key = "value"` lines
# A test value for every placeholder lives in Minecraft/test/test-values.env.
#
# Not placeholders, but required by the tooling itself (see README):
#   server environments: MC_SERVER_HOST, MC_SERVER_SFTP_PORT, MC_SERVER_MC_PORT,
#                        MC_SERVER_PROXY_HOST (optional), AMP_SFTP_HOST_KEY
#   repository:          AMP_SFTP_USER, AMP_SFTP_PASSWORD (the one deploy account), MC_COLLECT_KEY
placeholders:
  MC_DB_HOST:
    kind: secret
    scope: repository
    description: MySQL host, shared by all servers and all their MySQL plugins.
    sources: [Backend, Proxy]
    mask: keyed  # usually "localhost": never replace it globally when masking server files
  MC_DB_PORT:
    kind: secret
    scope: repository
    description: MySQL port, shared by all servers and all their MySQL plugins.
    sources: [Backend, Proxy]
    mask: keyed  # e.g. "3306": never replace it globally when masking server files
  MC_DB_USERNAME:
    kind: secret
    scope: environment
    description: >-
      MySQL user of this server (used by all its MySQL plugins). Every server has its own unique
      user: set it in each server's environment, never as a repository secret.
    sources: [Backend, Proxy]
    mask: keyed
  MC_DB_PASSWORD:
    kind: secret
    scope: environment
    description: >-
      MySQL password of this server's user. Set it in each server's environment, never as a
      repository secret.
    sources: [Backend, Proxy]
  MC_VELOCITY_FORWARDING_SECRET:
    kind: secret
    scope: environment
    description: >-
      Velocity modern-forwarding secret (paper-global.yml proxies.velocity.secret). Must equal
      the proxy's server-only forwarding.secret file.
    sources: [Backend]
  MC_DISCORD_BOT_TOKEN:
    kind: secret
    scope: repository
    description: Token of the single Irrenhaus Discord bot (SimpleProxyChat on the proxy).
    sources: [Proxy]
  MC_VELOCITY_SERVERS:
    kind: secret
    scope: collected
    expand: toml-entries
    description: >-
      Velocity's [servers] table, built from every mc-backend-<Name> / mc-server-<Name>
      environment (name from the environment, address from MC_SERVER_PROXY_HOST or
      MC_SERVER_HOST plus MC_SERVER_MC_PORT). Names used in `try` must exist (boot test checks).
    sources: [Proxy]
